spring.application.name=ParkingApp

# =========================
# Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/parking_db
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# Server
# =========================
server.port=8088

# =========================
# Security / JWT
# =========================
jwt.secret=ParkingAppSuperSecretKey2026ForJwtAuthentication123456
jwt.expiration=86400000

# =========================
# Frontend / CORS
# =========================
app.frontend.url=http://127.0.0.1:5500

# =========================
# OAuth2 Redirect
# =========================
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:${app.frontend.url}/oauth2/redirect}

# =========================
# Google OAuth2
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# =========================
# Default Admin
# =========================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}